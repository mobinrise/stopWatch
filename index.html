<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Stopwatch - Keyboard Shortcuts & Sound</title>
    <meta property="og:title" content="Enhanced Stopwatch with Sound & Keyboard Shortcuts">
    <meta property="og:description" content="Precision stopwatch with lap recording, sound effects, and keyboard shortcuts (Space, R, L)">
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG Icons
        const Play = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        );

        const Pause = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
        );

        const RotateCcw = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
        );

        const Clock = () => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        );

        const Volume2 = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
        );

        const VolumeX = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        );

        const Keyboard = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path>
            </svg>
        );

        function EnhancedStopwatch() {
            const [time, setTime] = useState(0);
            const [isRunning, setIsRunning] = useState(false);
            const [laps, setLaps] = useState([]);
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [showShortcuts, setShowShortcuts] = useState(false);
            const intervalRef = useRef(null);

            const playSound = (type) => {
                if (!soundEnabled) return;
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                if (type === 'start') {
                    oscillator.frequency.value = 800;
                    gainNode.gain.value = 0.1;
                } else if (type === 'pause') {
                    oscillator.frequency.value = 400;
                    gainNode.gain.value = 0.1;
                } else if (type === 'lap') {
                    oscillator.frequency.value = 600;
                    gainNode.gain.value = 0.05;
                } else if (type === 'reset') {
                    oscillator.frequency.value = 300;
                    gainNode.gain.value = 0.1;
                }
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
            };

            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        handleStartPause();
                    } else if (e.code === 'KeyR') {
                        e.preventDefault();
                        handleReset();
                    } else if (e.code === 'KeyL' && isRunning) {
                        e.preventDefault();
                        handleLap();
                    }
                };

                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [isRunning, time]);

            useEffect(() => {
                if (isRunning) {
                    intervalRef.current = setInterval(() => {
                        setTime(prevTime => prevTime + 10);
                    }, 10);
                } else {
                    if (intervalRef.current) {
                        clearInterval(intervalRef.current);
                    }
                }

                return () => {
                    if (intervalRef.current) {
                        clearInterval(intervalRef.current);
                    }
                };
            }, [isRunning]);

            const formatTime = (milliseconds) => {
                const totalSeconds = Math.floor(milliseconds / 1000);
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                const ms = Math.floor((milliseconds % 1000) / 10);

                return {
                    hours: String(hours).padStart(2, '0'),
                    minutes: String(minutes).padStart(2, '0'),
                    seconds: String(seconds).padStart(2, '0'),
                    milliseconds: String(ms).padStart(2, '0')
                };
            };

            const handleStartPause = () => {
                setIsRunning(!isRunning);
                playSound(isRunning ? 'pause' : 'start');
            };

            const handleReset = () => {
                setIsRunning(false);
                setTime(0);
                setLaps([]);
                playSound('reset');
            };

            const handleLap = () => {
                if (time > 0) {
                    setLaps([{ time, lapNumber: laps.length + 1 }, ...laps]);
                    playSound('lap');
                }
            };

            const { hours, minutes, seconds, milliseconds } = formatTime(time);

            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 flex items-center justify-center p-4">
                    <div className="w-full max-w-md">
                        <div className="bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl p-8 border border-white/20">
                            <div className="flex items-center justify-between mb-8">
                                <div className="flex items-center gap-2">
                                    <Clock />
                                    <h1 className="text-3xl font-bold text-white">Stopwatch</h1>
                                </div>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => setSoundEnabled(!soundEnabled)}
                                        className="p-2 bg-white/20 hover:bg-white/30 rounded-lg transition-all"
                                    >
                                        {soundEnabled ? <Volume2 /> : <VolumeX />}
                                    </button>
                                    <button
                                        onClick={() => setShowShortcuts(!showShortcuts)}
                                        className="p-2 bg-white/20 hover:bg-white/30 rounded-lg transition-all"
                                    >
                                        <Keyboard />
                                    </button>
                                </div>
                            </div>

                            {showShortcuts && (
                                <div className="bg-white/10 backdrop-blur-sm rounded-xl p-4 mb-6 border border-white/20">
                                    <h3 className="text-white font-semibold mb-2 text-sm">Keyboard Shortcuts:</h3>
                                    <div className="space-y-1 text-white/80 text-xs">
                                        <div className="flex justify-between">
                                            <span>Space</span>
                                            <span>Start/Pause</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>R</span>
                                            <span>Reset</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>L</span>
                                            <span>Lap (when running)</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="bg-white/5 backdrop-blur-sm rounded-2xl p-8 mb-6 border border-white/10">
                                <div className="text-center">
                                    <div className="flex items-center justify-center gap-1 mb-2">
                                        {hours !== '00' && (
                                            <>
                                                <span className="text-5xl font-bold text-white font-mono">{hours}</span>
                                                <span className="text-3xl font-bold text-white/80 mt-2">:</span>
                                            </>
                                        )}
                                        <span className="text-7xl font-bold text-white font-mono">{minutes}</span>
                                        <span className="text-5xl font-bold text-white/80 mt-4">:</span>
                                        <span className="text-7xl font-bold text-white font-mono">{seconds}</span>
                                        <span className="text-4xl font-bold text-white/60 mt-8 ml-1">.{milliseconds}</span>
                                    </div>
                                    <div className="flex justify-center gap-8 text-white/60 text-sm">
                                        {hours !== '00' && <span>Hours</span>}
                                        <span>Minutes</span>
                                        <span>Seconds</span>
                                        <span>MS</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-4 mb-6">
                                <button
                                    onClick={handleStartPause}
                                    className={`flex-1 flex items-center justify-center gap-2 py-4 rounded-xl font-semibold transition-all transform hover:scale-105 ${
                                        isRunning ? 'bg-yellow-500 hover:bg-yellow-600 text-white' : 'bg-green-500 hover:bg-green-600 text-white'
                                    }`}
                                >
                                    {isRunning ? <><Pause /> Pause</> : <><Play /> Start</>}
                                </button>

                                <button
                                    onClick={handleReset}
                                    className="flex-1 flex items-center justify-center gap-2 py-4 rounded-xl font-semibold bg-red-500 hover:bg-red-600 text-white transition-all transform hover:scale-105"
                                >
                                    <RotateCcw /> Reset
                                </button>
                            </div>

                            {isRunning && (
                                <button
                                    onClick={handleLap}
                                    className="w-full py-3 rounded-xl font-semibold bg-blue-500 hover:bg-blue-600 text-white transition-all mb-6"
                                >
                                    Record Lap
                                </button>
                            )}

                            {laps.length > 0 && (
                                <div className="bg-white/5 backdrop-blur-sm rounded-2xl p-4 border border-white/10">
                                    <h3 className="text-white font-semibold mb-3 text-center">Lap Times ({laps.length})</h3>
                                    <div className="max-h-60 overflow-y-auto space-y-2">
                                        {laps.map((lap, index) => {
                                            const lapTime = formatTime(lap.time);
                                            const prevLapTime = index < laps.length - 1 ? laps[index + 1].time : 0;
                                            const lapDiff = lap.time - prevLapTime;
                                            const diffTime = formatTime(lapDiff);
                                            
                                            return (
                                                <div key={index} className="flex justify-between items-center bg-white/10 rounded-lg p-3 border border-white/20">
                                                    <span className="text-white/80 font-semibold">Lap {lap.lapNumber}</span>
                                                    <div className="text-right">
                                                        <div className="text-white font-mono font-semibold">
                                                            {lapTime.hours !== '00' && `${lapTime.hours}:`}
                                                            {lapTime.minutes}:{lapTime.seconds}.{lapTime.milliseconds}
                                                        </div>
                                                        <div className="text-white/60 text-xs font-mono">
                                                            +{diffTime.hours !== '00' && `${diffTime.hours}:`}
                                                            {diffTime.minutes}:{diffTime.seconds}.{diffTime.milliseconds}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<EnhancedStopwatch />, document.getElementById('root'));
    </script>
</body>
</html>
